<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="moonlight" cx="70%" cy="15%" r="60%">
      <stop offset="0%" stop-color="#0f1e36"/>
      <stop offset="100%" stop-color="#050a14"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="40%">
      <stop offset="0%" stop-color="rgba(138,180,216,0.06)"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;1,300&amp;display=swap');
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#moonlight)"/>

  <!-- Subtle center glow -->
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Ripple rings (decorative) -->
  <circle cx="600" cy="340" r="200" fill="none" stroke="rgba(138,180,216,0.06)" stroke-width="1"/>
  <circle cx="600" cy="340" r="140" fill="none" stroke="rgba(138,180,216,0.08)" stroke-width="1"/>
  <circle cx="600" cy="340" r="80" fill="none" stroke="rgba(138,180,216,0.1)" stroke-width="1"/>

  <!-- Stars -->
  <circle cx="180" cy="90" r="1" fill="rgba(180,200,230,0.3)"/>
  <circle cx="350" cy="60" r="0.8" fill="rgba(180,200,230,0.2)"/>
  <circle cx="520" cy="110" r="1.2" fill="rgba(180,200,230,0.25)"/>
  <circle cx="780" cy="75" r="0.9" fill="rgba(180,200,230,0.3)"/>
  <circle cx="950" cy="100" r="1" fill="rgba(180,200,230,0.2)"/>
  <circle cx="1050" cy="55" r="0.7" fill="rgba(180,200,230,0.25)"/>
  <circle cx="100" cy="150" r="0.6" fill="rgba(180,200,230,0.15)"/>
  <circle cx="1100" cy="160" r="1.1" fill="rgba(180,200,230,0.2)"/>

  <!-- Title -->
  <text x="600" y="270" text-anchor="middle" font-family="Cormorant Garamond, Georgia, serif" font-size="72" font-weight="300" letter-spacing="12" fill="rgba(235,240,248,0.95)">
    Rêvesvoir
  </text>

  <!-- Tagline -->
  <text x="600" y="340" text-anchor="middle" font-family="Cormorant Garamond, Georgia, serif" font-size="22" font-weight="300" font-style="italic" fill="rgba(200,215,235,0.8)">
    Seeing dreams.
  </text>

  <!-- Sub tagline -->
  <text x="600" y="385" text-anchor="middle" font-family="Cormorant Garamond, Georgia, serif" font-size="18" font-weight="300" fill="rgba(170,195,225,0.6)">
    A reservoir of what your unconscious already knows.
  </text>

  <!-- Small ember dot — the AI presence -->
  <circle cx="600" cy="430" r="3" fill="#c9a84c" opacity="0.5"/>

  <!-- Bottom line -->
  <line x1="500" y1="480" x2="700" y2="480" stroke="rgba(138,180,216,0.12)" stroke-width="0.5"/>

  <!-- URL -->
  <text x="600" y="520" text-anchor="middle" font-family="Cormorant Garamond, Georgia, serif" font-size="14" font-weight="300" letter-spacing="4" fill="rgba(140,170,210,0.4)">
    revesvoir.com
  </text>
</svg>
